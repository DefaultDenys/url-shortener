<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #f74c00;
      --accent-hover: #ff6a2b;
      --success: #3dd68c;
      --error: #ff6b6b;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "Cascadia Code", "Consolas", monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --border: #d8e0ea;
        --text: #1a2332;
        --muted: #5c6b82;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font);
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(247, 76, 0, 0.18), transparent),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    main {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    input[type="url"] {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="url"]:focus {
      border-color: var(--accent);
    }

    button[type="submit"] {
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    button[type="submit"]:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      display: none;
    }

    .result.visible {
      display: block;
    }

    .result-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.5rem;
    }

    .result-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .result-link a {
      flex: 1;
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--success);
      word-break: break-all;
      text-decoration: none;
    }

    .result-link a:hover {
      text-decoration: underline;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      padding: 0;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
    }

    .copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .copy-btn.copied {
      border-color: var(--success);
      color: var(--success);
    }

    .copy-btn svg {
      width: 1rem;
      height: 1rem;
    }

    .copy-btn .icon-check {
      display: none;
    }

    .copy-btn.copied .icon-copy {
      display: none;
    }

    .copy-btn.copied .icon-check {
      display: block;
    }

    .error {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      background: rgba(255, 107, 107, 0.12);
      border: 1px solid rgba(255, 107, 107, 0.35);
      color: var(--error);
      font-size: 0.9rem;
      display: none;
    }

    .error.visible {
      display: block;
    }

    footer {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <span class="badge">Rust + Tokio + Axum</span>
      <h1>Shorten your link</h1>
      <p class="subtitle">Paste a long URL below and get a short link you can share.</p>

      <form id="shorten-form">
        <label for="url_original">Long URL</label>
        <div class="input-row">
          <input
            type="url"
            id="url_original"
            name="url_original"
            placeholder="https://example.com/very/long/path"
            required
            autocomplete="url"
          >
          <button type="submit" id="submit-btn">Shorten</button>
        </div>
      </form>

      <div id="error" class="error" role="alert"></div>

      <div id="result" class="result">
        <div class="result-label">Your short link</div>
        <div class="result-link">
          <a id="short-link" href="#" target="_blank" rel="noopener noreferrer"></a>
          <button
            type="button"
            class="copy-btn"
            id="copy-btn"
            aria-label="Copy link"
            title="Copy link"
          >
            <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <footer>Made by Denis Lempl</footer>
  </main>

  <script>
    const form = document.getElementById("shorten-form");
    const input = document.getElementById("url_original");
    const submitBtn = document.getElementById("submit-btn");
    const resultBox = document.getElementById("result");
    const shortLink = document.getElementById("short-link");
    const copyBtn = document.getElementById("copy-btn");
    const errorBox = document.getElementById("error");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add("visible");
      resultBox.classList.remove("visible");
    }

    function hideError() {
      errorBox.classList.remove("visible");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideError();

      const url_original = input.value.trim();
      if (!url_original) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Shortening…";

      try {
        const response = await fetch("/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url_original }),
        });

        if (!response.ok) {
          throw new Error("Server returned " + response.status);
        }

        const data = await response.json();
        const fullShortUrl = window.location.origin + "/" + data.url_short;

        shortLink.href = fullShortUrl;
        shortLink.textContent = fullShortUrl;
        resultBox.classList.add("visible");
      } catch (err) {
        showError("Could not shorten URL. Please try again.");
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Shorten";
      }
    });

    let copyResetTimer = null;

    copyBtn.addEventListener("click", async () => {
      const text = shortLink.textContent;
      if (!text) return;

      try {
        await navigator.clipboard.writeText(text);
        if (copyResetTimer) clearTimeout(copyResetTimer);

        copyBtn.classList.add("copied");
        copyBtn.setAttribute("aria-label", "Copied");
        copyBtn.setAttribute("title", "Copied");

        copyResetTimer = setTimeout(() => {
          copyBtn.classList.remove("copied");
          copyBtn.setAttribute("aria-label", "Copy link");
          copyBtn.setAttribute("title", "Copy link");
        }, 1500);
      } catch {
        showError("Could not copy to clipboard.");
      }
    });
  </script>
</body>
</html>
